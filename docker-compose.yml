services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: genome
      POSTGRES_PASSWORD: genome
      POSTGRES_DB: genome
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genome -d genome"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://genome:genome@db:5432/genome
      JWT_SECRET: dev-only-change-me
      REPOS_ROOT_PATH: /data/repos
      LISTEN_ADDR: 0.0.0.0:8000
      DOCKER_SOCKET_PATH: /var/run/docker.sock
    ports:
      - "8000:8000"
    volumes:
      - ./data/repos:/data/repos
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
