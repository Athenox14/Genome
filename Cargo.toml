[workspace]
resolver = "2"
members = [
    "crates/entity",
    "crates/migration",
    "crates/git-core",
    "crates/auth",
    "crates/actions",
    "crates/graphql-api",
    "crates/dev-env",
    "crates/webhooks",
    "crates/server",
    "crates/ssh-server",
    "crates/runner",
    "crates/xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["ws", "macros"] }
async-graphql = { version = "7", features = ["chrono", "uuid"] }
async-graphql-axum = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
git2 = "0.19"
jsonwebtoken = "9"
argon2 = "0.5"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bollard = "0.17"
serde_yaml = "0.9"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
futures-util = "0.3"
tar = "0.4"
regex = "1"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# NOTE: intentionally NOT panic = "abort" -- axum relies on catching a panic
# per-request (unwinding) so a bug in one handler doesn't take down the
# whole server process; abort would remove that safety net.
